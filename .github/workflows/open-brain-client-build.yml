name: Open Brain client build

# Gate for PRs into open-brain: the patched client must still build.
# Note: PRs/pushes made with the default GITHUB_TOKEN (the sync bot) do NOT
# trigger this — the sync workflow runs the same build inline for that case.

on:
  pull_request:
    branches: [open-brain]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - run: npm ci

      - run: npm run frontend
